name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pure history checks
        run: python3 scripts/test.py
      - name: Build Apple Silicon application
        run: python3 scripts/build.py
      - name: Validate packaging
        run: python3 scripts/package.py
